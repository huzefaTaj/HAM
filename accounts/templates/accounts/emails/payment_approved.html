<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAM</title>
</head>
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background:#ffffff;">
    <tr>
      <td align="center" style="padding:24px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="border-collapse:collapse;max-width:560px;width:100%;">
          <tr>
            <td style="font-family:Arial,sans-serif;color:#0F172A;">
              <div style="font-weight:800;font-size:22px;color:#4F46E5;text-align:center;margin:0 0 12px;">HAM</div>
              <div style="border:1px solid #E2E8F0;border-radius:12px;padding:18px;">
                <p style="margin:0 0 12px;">Hello{% if user %} <strong>{{ user.get_full_name }}</strong>{% endif %},</p>
                <p style="margin:0 0 12px;">Your payment is approved.</p>
                <div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:12px;">
                  <div style="margin:0 0 6px;"><strong>Type:</strong> {{ payment_type }}</div>
                  <div style="margin:0 0 6px;"><strong>Amount:</strong> {{ currency_symbol }}{{ amount }}</div>
                  <div style="margin:0;"><strong>Approved by:</strong> {{ approved_by }}</div>
                </div>
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
