{% extends "accounts/auth_base.html" %}

{% block title %}Reset Password · HAM{% endblock %}

{% block auth_subtitle %}Choose a new password{% endblock %}

{% block auth_body %}
  {% if token_valid %}
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label for="new_password">New Password</label>
      <input id="new_password" name="new_password" type="password" required>
    </div>
    <div class="field">
      <label for="confirm_password">Confirm Password</label>
      <input id="confirm_password" name="confirm_password" type="password" required>
    </div>
    <button type="submit" class="btn-primary">Update Password</button>
  </form>
  {% else %}
    <a class="btn-primary" href="{% url 'forgot_password' %}" style="text-decoration:none;display:inline-block;width:100%;text-align:center;">Request New Link</a>
  {% endif %}

  <div class="auth-links">
    <a href="{% url 'login' %}">Back to login</a>
  </div>
{% endblock %}
