{% extends "base.html" %}

{% block title %}Change Password · HAM{% endblock %}

{% block extra_head %}
<style>
  .password-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    padding: 1.5rem;
  }

  .password-card {
    width: 100%;
    max-width: 360px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    padding: 2rem;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  }

  .password-card h1 {
    font-size: 1.3rem;
    margin: 0 0 0.25rem;
  }

  .password-subtitle {
    color: var(--color-text-muted);
    font-size: 0.85rem;
    margin: 0 0 1.75rem;
  }

  .field {
    margin-bottom: 1rem;
  }

  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 0.35rem;
  }

  .field input {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
  }

  .field input:focus {
    outline: 2px solid var(--color-secondary);
    outline-offset: 1px;
  }

  .password-error {
    background: #FEF2F2;
    color: #B91C1C;
    border: 1px solid #FECACA;
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }

  .password-card .btn-primary {
    width: 100%;
    margin-top: 0.25rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="password-wrap">
  <div class="password-card">
    <h1>Change Password</h1>
    <p class="password-subtitle">You need to set a new password before continuing.</p>

    {% if error %}
    <div class="password-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'change_password' %}">
      {% csrf_token %}
      <div class="field">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" required autofocus>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn-primary">Save</button>
    </form>
  </div>
</div>
{% endblock %}
