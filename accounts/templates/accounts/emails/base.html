<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAM</title>
  <style>
    /* Keep minimal CSS; most styling is inline for email-client compatibility. */
    a { color: #4F46E5; }
  </style>
</head>
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background:#ffffff;">
    <tr>
      <td align="center" style="padding:24px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="border-collapse:collapse;max-width:560px;width:100%;">
          <tr>
            <td style="font-family:Arial,sans-serif;color:#0F172A;">
              <div style="font-weight:800;font-size:22px;color:#4F46E5;text-align:center;margin:0 0 12px;">HAM</div>
              <div style="border:1px solid #E2E8F0;border-radius:12px;padding:18px;">
                {% block body %}{% endblock %}
              </div>
              <div style="height:12px;line-height:12px;">&nbsp;</div>
              <div style="color:#64748B;font-size:13px;">If you didn’t request this, you can ignore this email.</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
