{% extends "base.html" %}

{% block title %}Login · HAM{% endblock %}

{% block extra_head %}
<style>
  main {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
  }

  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    padding: 2rem;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  }

  .login-logo {
    display: block;
    text-align: center;
    font-weight: 700;
    font-size: 1.75rem;
    letter-spacing: 0.03em;
    color: var(--color-primary);
    margin-bottom: 0.25rem;
  }

  .login-subtitle {
    text-align: center;
    color: var(--color-text-muted);
    font-size: 0.85rem;
    margin: 0 0 1.75rem;
  }

  .field {
    margin-bottom: 1rem;
  }

  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 0.35rem;
  }

  .field input {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
  }

  .field input:focus {
    outline: 2px solid var(--color-secondary);
    outline-offset: 1px;
  }

  .login-error {
    background: #FEF2F2;
    color: #B91C1C;
    border: 1px solid #FECACA;
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }

  .login-card .btn-primary {
    width: 100%;
    margin-top: 0.25rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="login-card">
  <span class="login-logo">HAM</span>
  <p class="login-subtitle">Sign in to your account</p>

  {% if error %}
  <div class="login-error">{{ error }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn-primary">Log in</button>
  </form>
</div>
{% endblock %}
