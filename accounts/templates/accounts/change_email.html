{% extends "base.html" %}

{% block title %}Change Email · HAM{% endblock %}

{% block extra_head %}
<style>
  .form-card {
    max-width: 520px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    padding: 1.75rem;
    margin: 0 auto;
  }

  .form-card h1 {
    margin: 0 0 1.5rem;
    font-size: 1.3rem;
  }

  .field {
    margin-bottom: 1.1rem;
  }

  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 0.35rem;
  }

  .field input {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
    background: var(--color-surface);
    color: var(--color-text);
  }

  .hint {
    color: var(--color-text-muted);
    font-size: 0.8rem;
    margin-top: 0.35rem;
  }

  .msg-error {
    background: #FEF2F2;
    color: #B91C1C;
    border: 1px solid #FECACA;
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }

  .msg-success {
    background: #ECFDF5;
    color: #047857;
    border: 1px solid #A7F3D0;
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }

  .actions {
    margin-top: 1rem;
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .actions a.btn-cancel {
    text-decoration: none;
  }
</style>
{% endblock %}

{% block content %}
<div class="form-card">
  <h1>Change Email</h1>

  {% if error %}
    <div class="msg-error">{{ error }}</div>
  {% endif %}
  {% if success %}
    <div class="msg-success">{{ success }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}

    <div class="field">
      <label for="email">New Email</label>
      <input id="email" name="email" type="email" value="{{ request.user.email }}" required>
      <div class="hint">Email must be unique.</div>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary">Update</button>
      <a class="btn-cancel" href="{% url 'profile' %}">Back</a>
    </div>
  </form>
</div>
{% endblock %}
