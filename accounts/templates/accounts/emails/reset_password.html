{% extends "accounts/emails/base.html" %}

{% block body %}
<p style="margin:0 0 12px;font-family:Arial,sans-serif;color:#0F172A;">Hello{% if user %} <strong>{{ user.get_full_name }}</strong>{% endif %},</p>
<p style="margin:0 0 12px;font-family:Arial,sans-serif;color:#0F172A;">We received a request to reset your HAM password.</p>
<p style="margin:0 0 14px;font-family:Arial,sans-serif;color:#0F172A;">This link is valid for <strong>10 minutes</strong>:</p>
<div style="margin:0 0 16px;">
  <a href="{{ reset_url }}" style="display:inline-block;padding:10px 14px;background:#4F46E5;color:#ffffff !important;border-radius:10px;text-decoration:none;font-weight:700;font-family:Arial,sans-serif;">Reset Password</a>
</div>
<p style="margin:0 0 8px;font-family:Arial,sans-serif;color:#64748B;font-size:13px;">Or copy this link:</p>
<div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:10px 12px;font-family:Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace;font-size:12.5px;word-break:break-all;line-height:1.35;color:#0F172A;">{{ reset_url }}</div>
{% endblock %}
